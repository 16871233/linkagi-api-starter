<!doctype html>
<meta charset="utf-8">
<title>LinkAGI API 路由诊断</title>
<meta name="description" content="只读检查 OpenAI-compatible API 路由是否到达鉴权层，不读取或上传 API Key。">
<style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 20px;color:#222}input{width:100%;padding:10px;margin:6px 0 14px;box-sizing:border-box}button{padding:10px 16px}pre{background:#f5f5f5;padding:14px;white-space:pre-wrap}small{color:#666}</style>
<h1>API 路由诊断</h1>
<p>只发送不带 Key 的请求，检查域名、TLS 和路由是否到达鉴权层。不会读取或上传 API Key。</p>
<label>根地址 <input id="root" value="https://api.linktoagi.com"></label>
<button id="run">开始检查</button>
<pre id="out">等待检查…</pre>
<small>401 只能证明请求到达鉴权层，不代表模型、余额或客户端兼容性已经验证。</small>
<p><a href="https://docs.linktoagi.com/">中文文档</a> · <a href="https://api.linktoagi.com/">注册/控制台</a></p>
<script>
const paths=[['OpenAI models','/v1/models','GET'],['Codex Responses','/v1/responses','POST'],['Claude Messages','/v1/messages','POST'],['Gemini generateContent','/v1beta/models/gemini-3.1-pro:generateContent','POST']];
document.querySelector('#run').onclick=async()=>{const root=document.querySelector('#root').value.replace(/\/$/,'');const out=document.querySelector('#out');out.textContent='';for(const [name,path,method] of paths){try{const r=await fetch(root+path,{method,headers:{'content-type':'application/json'},body:method==='POST'?'{}':undefined});out.textContent+=`${name}: HTTP ${r.status}\n`;}catch(e){out.textContent+=`${name}: 网络错误（浏览器 CORS 或地址不可达）\n`;}}};
</script>
